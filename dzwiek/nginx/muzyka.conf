# McRPG: dźwięk w przeglądarce. NIE WGRYWAĆ BEZ ZGODY ZIELU.
#
# Dopisać wewnątrz istniejącego bloku `server { ... }` dla mcgramy.pl (ten z certyfikatem,
# listen 443 ssl). DNS i certyfikat zostają bez zmian.
#
# Pliki strony (index.html, app.js, style.css, audio/) wgrywamy do katalogu `muzyka/`
# na wolumenie strony mcgramy.pl, więc nginx podaje je tak jak resztę strony.
# Port 8790 = dodatkowy port (allocation) serwera „mcgramy - MMORPG”, najlepiej na IP 127.0.0.1.

# /muzyka bez ukośnika -> /muzyka/ (strona liczy adresy względem katalogu)
location = /muzyka {
    return 301 /muzyka/;
}

# WebSocket do pluginu McRPGDzwiek
location = /muzyka/ws {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    # plugin wysyła ping co 30 s, więc 120 s wystarcza na wykrycie zerwanego połączenia
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # token jest w wiadomości, nie w adresie, ale i tak nie logujemy tej ścieżki
    access_log off;
}

# Pliki audio: dłuższa pamięć podręczna przeglądarki (strona sama ma no-cache).
location /muzyka/audio/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /muzyka/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
# Uwaga: add_header w location wyłącza nagłówki z poziomu server (np. HSTS).
# Jeśli blok server ma własne add_header, trzeba je powtórzyć w obu location wyżej.
